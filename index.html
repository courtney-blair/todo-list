<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do What ✅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> My To-do List ✨</h1>
    <div id="task">
        <input id="task-input" type="text" placeholder="Task">
        <input id="date-input" type="date" placeholder="Due Date">
        <button type="button" id="add-button">Add</button>
      <!--  <button type="button" id="delete-button">Delete</button> -->
</div>
   <div id="status">
    <div class="column" id="pending-column">
            <h2>Pending</h2>
    </div>
    <div class="column" id="in-progress-column">
            <h2>In Progress</h2>
    </div>
    <div class="column" id="completed-column">
            <h2>Completed</h2>
    </div>
</div> 
<script src="script.js"></script>
</body>
</html>
